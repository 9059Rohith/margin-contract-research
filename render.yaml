services:
  - type: web
    name: margin-contract-research
    runtime: docker
    healthCheckPath: /api/health
    disk:
      name: margin-data
      mountPath: /data
      sizeGB: 2
    envVars:
      - key: DATA_DIR
        value: /data
      - key: NODE_ENV
        value: production
      - key: LLM_API_KEY
        sync: false
